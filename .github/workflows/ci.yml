---
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/cache v4.3.0: bunx downloads (vnu-jar, typescript, terser,
      # oxlint, tsgolint, oxlint-standards) land in bun's package cache, and
      # lint-webui.sh's own tool cache is ~/.cache/clanker. Both are additive
      # caches keyed by the pinned versions in scripts/*.sh; restore-keys keeps
      # old entries so a version bump only fetches the delta. (~/.npm/_npx is
      # npx's cache and this repo has no npm step, so caching it saved nothing.)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/clanker
          key: bunx-${{ hashFiles('scripts/*.sh') }}
          restore-keys: bunx-
      # Python and workflow analysis gates: lint-python (ruff.toml) and
      # lint-yaml (.yamllint.yml) are both part of `make check`, so the pinned
      # analyzers must be on PATH first. Pins sourced from
      # scripts/tool-versions.sh, the same single source of truth the other
      # analyzers use.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: |
          source scripts/tool-versions.sh
          uv tool install "ruff==$RUFF_VERSION"
          uv tool install "yamllint==$YAMLLINT_VERSION"
      # The lint scripts run oxlint, tsc, terser and vnu through bunx at pinned
      # versions; the runner preinstalls node, but not bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: make check
      # C# analysis gate: scripts/test-idempotency.sh compiles pure-BCL sources
      # with mcs -warnaserror (warnings are errors, same contract as build) and
      # runs their unit/fuzz suites; suites needing game DLLs self-skip when
      # absent. Runners ship no mono, hence this step.
      - name: Install mono for the C# warning gate
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-mcs mono-runtime
      - run: bash scripts/test-idempotency.sh
  # macOS leg. The shell scripts carry explicit BSD branches (shasum in
  # digest.sh, date -r in package.sh, no sha256sum --quiet in install.sh), and
  # a branch nothing runs is a branch that rots: the Ubuntu job cannot catch a
  # BSD-only regression in any of them. It runs the lanes that need no game
  # install and no Linux-only tool. The C# gate is absent on purpose:
  # scripts/test-idempotency.sh needs mcs + mono, which the macOS runners do
  # not ship, and every suite it would run there self-skips anyway.
  shell-macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the bash floor the scripts must stay inside
        run: bash --version
      # Homebrew is preinstalled on the macOS runners, so this needs no
      # pinned action; the pin convention exists for third-party actions, not
      # for the runner image's own package manager.
      - name: Install shellcheck
        run: brew install shellcheck
      - run: make lint-shell
      - run: make test-recovery
