name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/cache v4.3.0: npx downloads (vnu-jar, typescript, oxlint,
      # tsgolint) and lint-webui.sh's tool cache are additive caches keyed by
      # the pinned versions in scripts/*.sh; restore-keys keeps old entries so
      # a version bump only fetches the delta.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.npm/_npx
            ~/.cache/clanker
          key: npx-${{ hashFiles('scripts/*.sh') }}
          restore-keys: npx-
      # Python analysis gate: lint-python is part of `make check` (ruff.toml),
      # so the pinned ruff must be on PATH first. Pin sourced from
      # scripts/tool-versions.sh, the same single source of truth the other
      # analyzers use; pipx ships on the runner image.
      - run: source scripts/tool-versions.sh && pipx install "ruff==$RUFF_VERSION"
      # The lint scripts run oxlint, tsc and vnu through bunx at pinned
      # versions; the runner preinstalls node, but not bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: make check
      # C# analysis gate: scripts/test-idempotency.sh compiles pure-BCL sources
      # with mcs -warnaserror (warnings are errors, same contract as build) and
      # runs their unit/fuzz suites; suites needing game DLLs self-skip when
      # absent. Runners ship no mono, hence this step.
      - name: Install mono for the C# warning gate
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-mcs mono-runtime
      - run: bash scripts/test-idempotency.sh
