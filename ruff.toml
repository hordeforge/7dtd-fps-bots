# Ruff config for the repo's Python surface: tools/ga/*.py and
# scripts/coverage_badge.py (`make lint-python`, part of `make check`).
#
# Defect-class baseline only (2026-08-25): the rules below are the set the
# tree already passes, proven by `ruff check .`. Runtime/correctness first:
#   E9     syntax errors and guaranteed runtime failures
#   F      pyflakes: undefined names, unused imports/variables, shadowed defs
#   W605   invalid escape sequences (silent str corruption class)
#   E402   module-level imports not at top of file; the tools/ga scripts
#          import sibling modules after a deliberate sys.path bootstrap, so
#          each such import carries a rule-scoped `# noqa: E402 -- reason`
#   RUF100 keeps those noqa directives honest: an ignore whose finding is
#          gone stops suppressing anything and fails the build instead
# Promoted 2026-08-25 (proven clean by `ruff check --select ... .` on the
# whole Python surface): W (pycodestyle warnings incl. W605 above), A
# (builtins shadowing), ARG (unused arguments = dead parameters), PIE
# (useless constructs), RET (needless returns before return). Style/
# modernization families that also pass today (FLY, FURB, PT) stay out to
# keep this a defect-class baseline.
# Promoted 2026-09-28 (every B finding fixed in the same change, so
# `ruff check --select B .` is clean): B (flake8-bugbear). Its B905 arm is
# the one that matters here: every zip() over parallel-length sequences now
# passes strict=True, so a length mismatch raises instead of silently
# truncating and dropping records. B007 retires the two counters that were
# never read.
#
# Known debt, deliberately NOT selected yet (fix in code-review passes, then
# move the rule up here): the default-preset style/modernization findings
# (I001, PLR1730, EXE001, BLE001, UP006, SIM114, UP031, PLR0124, SIM103,
# RUF019, RUF059, UP034), NPY002
# (np.random.seed in evolve.py and sweep.py: switching to a Generator would
# change every seeded run's results, so it is a behavior change, not a lint
# fix), and E501 line length (98 over-length lines at a 100-column cap).
#
# Type checking is not a gate. mypy over tools/ga + scripts is clean of real
# findings (the rest are missing third-party stubs for numpy, numba, matplotlib
# and PIL), but it is not wired into `make check`: the gate would have to
# install tools/ga/requirements.txt into a CI venv, and an unpinned local mypy
# is not evidence that a pinned CI run passes.
# Promoted 2026-09-28 (each group proven clean by `ruff check --select <G> .`
# over the whole Python surface, after the findings it did raise were fixed
# in the same change):
#   S    flake8-bandit: the security category. Its three findings were two
#        S101 asserts that are njit kernel guards (combat_sim.py) and one
#        S314 ElementTree.parse of this repo's own Cobertura output
#        (coverage_badge.py); each carries a rule-scoped noqa with that
#        reason, and RUF100 keeps them honest.
#   PTH  flake8-use-pathlib: open() -> Path.open(), os.replace -> Path.replace.
#        atomic_write_text keeps its fsync-then-rename contract; Path.replace
#        is the same os.rename syscall.
#   PERF, C4  performance and comprehension rewrites the tree already passes.
#   ERA  commented-out code (the one hit was a section marker reading as an
#        assignment; the comment is now prose).
#   ASYNC, DTZ, SLF, T10, G  async, datetime-naive, private-member,
#        debugger-statement and logging-format defects: no findings today,
#        and each is a whole category that was never switched on.
# The cap the tree is being held to. E501 is not selected yet (the debt is
# recorded below), so this value governs nothing today except a formatter run
# by hand; it is written down so the cap and the debt count cannot drift apart.
# `ruff format` is not a gate either: 11 files would be reformatted, so
# enforcing it now would red the build without a defect behind it.
line-length = 100
target-version = "py310"

[lint]
select = [
  "E402", "E9", "F", "W605", "RUF100", "W", "A", "ARG", "PIE", "RET", "B",
  "S", "PTH", "PERF", "C4", "ERA", "ASYNC", "DTZ", "SLF", "T10", "G",
]
